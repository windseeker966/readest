name: Android (wind)

# 自用：编译安卓版（aarch64 release APK），不签名，产物名 Readest-apk-<完整提交号>，保留 30 天。
# 替代 Mac 上原来的 ~/.local/share/readest-android/build-install.sh。
# 签名和安装在服务器（oracle VM）上做：~/.local/share/readest-android/install.sh 下载产物，
# 用原来那份 debug keystore 签名（手机上装的就是它签的，换 key 装不上），再 adb 装到手机。
# 手动编某个提交：gh workflow run wind-android.yml -R windseeker966/readest -f ref=<提交号>

run-name: Android ${{ inputs.ref || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 要编译的分支或提交号
        default: main
        required: true

concurrency:
  group: wind-android-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.repository == 'windseeker966/readest'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: 记下提交号
        run: |
          echo "SOURCE_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H%n%s'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: 安装依赖
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: wind-android-aarch64

      # 和上游 release.yml 一样：gen/android 只跟踪了一部分文件，先 init 生成完整工程、生成图标，再还原跟踪的文件
      - name: tauri android init
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

      - name: 编译（aarch64 release，不签名）
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: pnpm exec dotenv -e .env.tauri -- pnpm tauri android build -t aarch64 --apk

      - name: 打包
        run: |
          APK=apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          [ -f "$APK" ] || { echo "找不到 $APK"; find apps/readest-app/src-tauri/gen/android/app/build/outputs -name '*.apk'; exit 1; }
          mkdir -p out
          cp "$APK" out/readest-unsigned.apk
          echo "$SOURCE_REV" > out/SOURCE_REV
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Readest-apk-${{ env.SOURCE_REV }}
          path: out/
          if-no-files-found: error
          retention-days: 30
